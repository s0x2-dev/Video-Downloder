<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
  <title>Fetch — save any video</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="halo" aria-hidden="true"></div>

  <header class="topbar reveal">
    <span class="wordmark">Fetch</span>
  </header>

  <main class="stage">
    <section class="intro">
      <h1 class="intro__title reveal" style="--d: 0.04s">Save any video.</h1>
      <p class="intro__lede reveal" style="--d: 0.1s">
        Paste a link, choose a format, and keep the file — MP4 or MP3, right on your own machine.
      </p>
    </section>

    <section class="card reveal" style="--d: 0.16s" aria-label="Downloader">
      <div class="field">
        <label class="field__label" for="url">Link</label>
        <input type="text" id="url" class="input" placeholder="https://…" autocomplete="off" spellcheck="false" />
      </div>

      <div class="row">
        <div class="field">
          <label class="field__label" for="quality">Format</label>
          <div class="select">
            <select id="quality" class="input">
              <option value="best">Best available</option>
              <option value="1080">1080p</option>
              <option value="720" selected>720p</option>
              <option value="480">480p</option>
              <option value="audio">Audio · MP3</option>
            </select>
          </div>
        </div>

        <label class="switch" for="forceMp4">
          <span class="switch__text">Force MP4</span>
          <input type="checkbox" id="forceMp4" class="switch__input" />
          <span class="switch__track" aria-hidden="true"></span>
        </label>
      </div>

      <button id="infoBtn" class="btn btn--ghost">
        <span class="btn__label">Analyze link</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>

      <div class="result" id="card" hidden>
        <div class="result__media">
          <img id="thumb" class="result__thumb" alt="" hidden />
          <div class="result__text">
            <h2 class="result__title" id="title"></h2>
            <p class="result__meta" id="meta"></p>
          </div>
        </div>

        <div class="progress" id="barWrap" hidden>
          <div class="progress__head">
            <span id="status">Preparing…</span>
            <span class="progress__pct" id="pct">0.0%</span>
          </div>
          <div class="progress__track">
            <div class="progress__fill" id="bar"></div>
          </div>
        </div>

        <button id="downloadBtn" class="btn btn--primary">
          <span class="btn__label">Download</span>
        </button>

        <p class="error" id="error"></p>
      </div>
    </section>
  </main>

  <footer class="footer reveal" style="--d: 0.22s">
    <span>Fetch</span>
    <span class="footer__dot" aria-hidden="true"></span>
    <span>For personal use. Respect each site's terms.</span>
  </footer>

  <script src="app.js"></script>
</body>

</html>
